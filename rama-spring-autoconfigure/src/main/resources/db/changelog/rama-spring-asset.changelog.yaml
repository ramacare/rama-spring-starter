---
databaseChangeLog:
# Liquibase keeps the FIRST definition of a property that is valid for the database it
# is running against; a later definition of the same name is discarded, even a more
# specific one. Every `dbms:`-scoped override must therefore be declared BEFORE the
# unscoped default, or it is dead code. See starter#48.
#
# MySQL's bare `timestamp` is whole-second, which
# silently defeats the updatedAt conflict check in GenericEntityService.updateEntity
# (starter#41) — two writers inside the same second read back an unchanged timestamp and
# both are accepted. Microseconds are what Hibernate binds, so ask for all six digits.
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: mysql,mariadb
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: postgresql
# h2 -> TIMESTAMP(6), mssql -> datetime2(7); both already at or beyond microseconds.
- property:
    name: timestampType
    value: timestamp
- changeSet:
    id: rama-spring-asset-001-asset-file
    author: codex
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: asset_file
    changes:
    - createTable:
        tableName: asset_file
        columns:
        - column:
            name: id
            type: BIGINT
            autoIncrement: true
            constraints:
              primaryKey: true
              primaryKeyName: asset_file_id
              nullable: false
        - column:
            name: file_name
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: file_type
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: md5hash
            type: VARCHAR(50)
            constraints:
              nullable: false
        - column:
            name: original_file_name
            type: VARCHAR(255)
        - column:
            name: location
            type: VARCHAR(20)
            constraints:
              nullable: false
        - column:
            name: bucket_name
            type: VARCHAR(255)
            constraints:
              nullable: false
        - column:
            name: created_by
            type: VARCHAR(200)
        - column:
            name: updated_by
            type: VARCHAR(200)
        - column:
            name: created_at
            type: ${timestampType}
        - column:
            name: updated_at
            type: ${timestampType}
    - createIndex:
        tableName: asset_file
        indexName: ix_asset_file__location_bucket_name_md5hash
        columns:
        - column:
            name: location
        - column:
            name: bucket_name
        - column:
            name: md5hash
