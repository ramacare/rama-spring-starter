---
databaseChangeLog:
# Liquibase keeps the FIRST definition of a property that is valid for the database it
# is running against; a later definition of the same name is discarded, even a more
# specific one. Every `dbms:`-scoped override must therefore be declared BEFORE the
# unscoped default, or it is dead code. See starter#48.
#
# clobType backs every column whose entity field carries @Nationalized, so on SQL Server
# it must be an N-type: reading a varchar column through a nationalized mapping fails
# with "The conversion from varchar to NCHAR is unsupported."
- property:
    name: clobType
    value: "nvarchar(max)"
    dbms: mssql
- property:
    name: clobType
    value: longtext
    dbms: mysql,mariadb
# h2 -> CLOB, postgresql -> text
- property:
    name: clobType
    value: clob
# Same ordering rule as clobType above. MySQL's bare `timestamp` is whole-second, which
# silently defeats the updatedAt conflict check in GenericEntityService.updateEntity
# (starter#41) — two writers inside the same second read back an unchanged timestamp and
# both are accepted. Microseconds are what Hibernate binds, so ask for all six digits.
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: mysql,mariadb
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: postgresql
# h2 -> TIMESTAMP(6), mssql -> datetime2(7); both already at or beyond microseconds.
- property:
    name: timestampType
    value: timestamp
- changeSet:
    id: rama-spring-api-001-api-header-set
    author: codex
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: api_header_set
    changes:
    - createTable:
        tableName: api_header_set
        columns:
        - column:
            name: id
            type: VARCHAR(255)
            constraints:
              primaryKey: true
              primaryKeyName: api_header_set_id
              nullable: false
        - column:
            name: headers
            type: ${clobType}
            constraints:
              nullable: false
        - column:
            name: created_by
            type: VARCHAR(200)
        - column:
            name: updated_by
            type: VARCHAR(200)
        - column:
            name: created_at
            type: ${timestampType}
        - column:
            name: updated_at
            type: ${timestampType}
- changeSet:
    id: rama-spring-api-002-api
    author: codex
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: api
    changes:
    - createTable:
        tableName: api
        columns:
        - column:
            name: id
            type: VARCHAR(255)
            constraints:
              primaryKey: true
              primaryKeyName: api_id
              nullable: false
        - column:
            name: source_api_method
            type: ${clobType}
            constraints:
              nullable: false
        - column:
            name: source_api_url
            type: ${clobType}
            constraints:
              nullable: false
        - column:
            name: etl_code
            type: ${clobType}
        - column:
            name: etl_code_error
            type: ${clobType}
        - column:
            name: api_header_set_id
            type: VARCHAR(255)
        - column:
            name: created_by
            type: VARCHAR(200)
        - column:
            name: updated_by
            type: VARCHAR(200)
        - column:
            name: created_at
            type: ${timestampType}
        - column:
            name: updated_at
            type: ${timestampType}
    - createIndex:
        tableName: api
        indexName: idx_api_api_header_set_id
        columns:
        - column:
            name: api_header_set_id
