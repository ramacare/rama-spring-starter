---
databaseChangeLog:
# Liquibase keeps the FIRST definition of a property that is valid for the database it
# is running against; a later definition of the same name is discarded, even a more
# specific one. Every `dbms:`-scoped override must therefore be declared BEFORE the
# unscoped default, or it is dead code. See starter#48.
#
# clobType backs every column whose entity field carries @Nationalized, so on SQL Server
# it must be an N-type: reading a varchar column through a nationalized mapping fails
# with "The conversion from varchar to NCHAR is unsupported."
- property:
    name: clobType
    value: "nvarchar(max)"
    dbms: mssql
- property:
    name: clobType
    value: longtext
    dbms: mysql,mariadb
# h2 -> CLOB, postgresql -> text
- property:
    name: clobType
    value: clob
# Same ordering rule as clobType above. MySQL's bare `timestamp` is whole-second, which
# silently defeats the updatedAt conflict check in GenericEntityService.updateEntity
# (starter#41) — two writers inside the same second read back an unchanged timestamp and
# both are accepted. Microseconds are what Hibernate binds, so ask for all six digits.
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: mysql,mariadb
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: postgresql
# h2 -> TIMESTAMP(6), mssql -> datetime2(7); both already at or beyond microseconds.
- property:
    name: timestampType
    value: timestamp
- changeSet:
    id: rama-spring-idempotency-001-system-request-dedup
    author: claude
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: system_request_dedup
    changes:
    - createTable:
        tableName: system_request_dedup
        columns:
        - column:
            name: id
            type: VARCHAR(64)
            constraints:
              primaryKey: true
              primaryKeyName: system_request_dedup_pkey
              nullable: false
        - column:
            name: method
            type: VARCHAR(255)
        - column:
            name: username
            type: VARCHAR(255)
        - column:
            name: status
            type: VARCHAR(20)
            constraints:
              nullable: false
        - column:
            name: response_json
            type: ${clobType}
        - column:
            name: created_at
            type: ${timestampType}
            constraints:
              nullable: false
        - column:
            name: expires_at
            type: ${timestampType}
            constraints:
              nullable: false
    - createIndex:
        tableName: system_request_dedup
        indexName: ix_system_request_dedup__expires_at
        columns:
        - column:
            name: expires_at
