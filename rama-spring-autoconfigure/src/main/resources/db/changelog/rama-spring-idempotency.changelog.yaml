---
databaseChangeLog:
- changeSet:
    id: rama-spring-idempotency-001-system-request-dedup
    author: claude
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: system_request_dedup
    changes:
    - createTable:
        tableName: system_request_dedup
        columns:
        - column:
            name: id
            type: VARCHAR(64)
            constraints:
              primaryKey: true
              primaryKeyName: system_request_dedup_pkey
              nullable: false
        - column:
            name: method
            type: VARCHAR(255)
        - column:
            name: username
            type: VARCHAR(255)
        - column:
            name: status
            type: VARCHAR(20)
            constraints:
              nullable: false
        - column:
            name: response_json
            type: ${clobType}
        - column:
            name: created_at
            type: ${timestampType}
            constraints:
              nullable: false
        - column:
            name: expires_at
            type: ${timestampType}
            constraints:
              nullable: false
    - createIndex:
        tableName: system_request_dedup
        indexName: ix_system_request_dedup__expires_at
        columns:
        - column:
            name: expires_at
