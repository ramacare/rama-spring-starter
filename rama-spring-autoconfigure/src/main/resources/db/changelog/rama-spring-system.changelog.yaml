# ----------------------------------------------------------------------------
# Bounded-active + columnstore-archive tier for the revision audit log.
# Tracked by issue #20. SQL Server only.
#
# Default context (auto-applies on every consumer's next deploy):
#   008 -- create revision_id_seq, starting at MAX(id)+1,000,000 if a
#          revision table already exists, else 1. Prevents ID collisions
#          when later cutover moves rows into revision_archive (preserving
#          original ids) while revision_active grows from the gapped start.
#   009 -- create pf_revision_monthly partition function + ps_revision_monthly
#          partition scheme spanning months [now-12, now+24] for headroom.
#   010 -- create revision_active (rowstore, partitioned, clustered on
#          (revision_key, revision_datetime, id)) -- target of all new writes.
#   011 -- create revision_archive (clustered columnstore, partitioned) --
#          target of post-cutover backfill and ongoing sliding-window SWITCH.
#
# revision-cutover context (opt-in via spring.liquibase.contexts):
#   012 -- rename revision -> revision_legacy.
#   013 -- create view dbo.revision AS SELECT * FROM revision_active so the
#          Revision entity (@Table("revision")) keeps working post-cutover.
#          SQL Server allows INSERT through a simple SELECT * view.
#   014 -- create view dbo.revision_history that UNIONs active + archive +
#          legacy. Consumers needing full historical reads use this view.
#
# Until a consumer enables the revision-cutover context, the existing
# revision table is untouched -- 008-011 only create new objects alongside.
# See issue #20 for migration runbook.
# ----------------------------------------------------------------------------
- changeSet:
    id: rama-spring-system-008-revision-id-sequence
    author: claude
    dbms: mssql
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - sqlCheck:
        expectedResult: 0
        sql: SELECT COUNT(*) FROM sys.sequences WHERE name = 'revision_id_seq'
    changes:
    - sql:
        splitStatements: false
        sql: |
          DECLARE @start BIGINT = 1;
          IF OBJECT_ID('dbo.revision', 'U') IS NOT NULL
              SELECT @start = ISNULL(MAX(id) + 1000000, 1) FROM dbo.revision;
          DECLARE @stmt NVARCHAR(MAX) =
              N'CREATE SEQUENCE dbo.revision_id_seq AS BIGINT START WITH '
              + CAST(@start AS NVARCHAR(20))
              + N' INCREMENT BY 1 CACHE 100';
          EXEC sp_executesql @stmt;
- changeSet:
    id: rama-spring-system-009-revision-partition-scheme
    author: claude
    dbms: mssql
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - sqlCheck:
        expectedResult: 0
        sql: SELECT COUNT(*) FROM sys.partition_functions WHERE name = 'pf_revision_monthly'
    changes:
    - sql:
        splitStatements: false
        sql: |
          -- Build a list of monthly RANGE RIGHT boundaries from -12 to +24 months.
          DECLARE @i INT = -12;
          DECLARE @max INT = 24;
          DECLARE @anchor DATE = DATEFROMPARTS(YEAR(SYSUTCDATETIME()), MONTH(SYSUTCDATETIME()), 1);
          DECLARE @values NVARCHAR(MAX) = N'';
          WHILE @i <= @max
          BEGIN
              DECLARE @d DATE = DATEADD(MONTH, @i, @anchor);
              IF LEN(@values) > 0 SET @values = @values + N', ';
              SET @values = @values + N'''' + CONVERT(VARCHAR(10), @d, 23) + N' 00:00:00''';
              SET @i = @i + 1;
          END
          DECLARE @sql NVARCHAR(MAX) =
              N'CREATE PARTITION FUNCTION pf_revision_monthly (DATETIME2) '
              + N'AS RANGE RIGHT FOR VALUES (' + @values + N')';
          EXEC sp_executesql @sql;
          EXEC('CREATE PARTITION SCHEME ps_revision_monthly AS PARTITION pf_revision_monthly ALL TO ([PRIMARY])');
- changeSet:
    id: rama-spring-system-010-revision-active-table
    author: claude
    dbms: mssql
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: revision_active
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE TABLE dbo.revision_active (
              id BIGINT NOT NULL
                  CONSTRAINT df_revision_active_id DEFAULT (NEXT VALUE FOR dbo.revision_id_seq),
              revision_key VARCHAR(255) NOT NULL,
              mrn VARCHAR(100) NULL,
              revision_entity VARCHAR(255) NULL,
              revision_datetime DATETIME2 NOT NULL,
              revision_data NVARCHAR(MAX) NOT NULL,
              revision_change NVARCHAR(MAX) NULL,
              created_by VARCHAR(200) NULL,
              updated_by VARCHAR(200) NULL,
              created_at DATETIME2 NULL,
              updated_at DATETIME2 NULL,
              CONSTRAINT pk_revision_active PRIMARY KEY NONCLUSTERED (id) ON [PRIMARY],
              INDEX cx_revision_active
                  CLUSTERED (revision_key, revision_datetime, id)
                  ON ps_revision_monthly(revision_datetime),
              INDEX ix_revision_active__entity_mrn_datetime
                  NONCLUSTERED (revision_entity, mrn, revision_datetime DESC)
                  ON ps_revision_monthly(revision_datetime)
          );
- changeSet:
    id: rama-spring-system-011-revision-archive-table
    author: claude
    dbms: mssql
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        tableExists:
          tableName: revision_archive
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE TABLE dbo.revision_archive (
              id BIGINT NOT NULL,
              revision_key VARCHAR(255) NOT NULL,
              mrn VARCHAR(100) NULL,
              revision_entity VARCHAR(255) NULL,
              revision_datetime DATETIME2 NOT NULL,
              revision_data NVARCHAR(MAX) NOT NULL,
              revision_change NVARCHAR(MAX) NULL,
              created_by VARCHAR(200) NULL,
              updated_by VARCHAR(200) NULL,
              created_at DATETIME2 NULL,
              updated_at DATETIME2 NULL,
              INDEX cci_revision_archive CLUSTERED COLUMNSTORE
                  ON ps_revision_monthly(revision_datetime)
          );
          CREATE UNIQUE NONCLUSTERED INDEX uix_revision_archive_id
              ON dbo.revision_archive (id, revision_datetime)
              ON ps_revision_monthly(revision_datetime);
- changeSet:
    id: rama-spring-system-012-revision-rename-legacy
    author: claude
    dbms: mssql
    context: revision-cutover
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - tableExists:
        tableName: revision
    - not:
        tableExists:
          tableName: revision_legacy
    changes:
    - sql:
        sql: EXEC sp_rename 'dbo.revision', 'revision_legacy';
- changeSet:
    id: rama-spring-system-013-revision-write-view
    author: claude
    dbms: mssql
    context: revision-cutover
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        viewExists:
          viewName: revision
    - not:
        tableExists:
          tableName: revision
    changes:
    - sql:
        splitStatements: false
        sql: |
          EXEC('CREATE VIEW dbo.revision AS
                SELECT id, revision_key, mrn, revision_entity, revision_datetime,
                       revision_data, revision_change,
                       created_by, updated_by, created_at, updated_at
                FROM dbo.revision_active');
- changeSet:
    id: rama-spring-system-014-revision-history-view
    author: claude
    dbms: mssql
    context: revision-cutover
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - not:
        viewExists:
          viewName: revision_history
    changes:
    - sql:
        splitStatements: false
        sql: |
          DECLARE @stmt NVARCHAR(MAX) = N'CREATE VIEW dbo.revision_history AS
              SELECT id, revision_key, mrn, revision_entity, revision_datetime,
                     revision_data, revision_change,
                     created_by, updated_by, created_at, updated_at
              FROM dbo.revision_active
              UNION ALL
              SELECT id, revision_key, mrn, revision_entity, revision_datetime,
                     revision_data, revision_change,
                     created_by, updated_by, created_at, updated_at
              FROM dbo.revision_archive';
          IF OBJECT_ID('dbo.revision_legacy', 'U') IS NOT NULL
              SET @stmt = @stmt + N'
              UNION ALL
              SELECT id, revision_key, mrn, revision_entity, revision_datetime,
                     revision_data, revision_change,
                     created_by, updated_by, created_at, updated_at
              FROM dbo.revision_legacy';
          EXEC sp_executesql @stmt;
