---
databaseChangeLog:
# Liquibase keeps the FIRST definition of a property that is valid for the database it
# is running against; a later definition of the same name is discarded, even a more
# specific one. Every `dbms:`-scoped override must therefore be declared BEFORE the
# unscoped default, or it is dead code. See starter#48.
#
# clobType backs every column whose entity field carries @Nationalized, so on SQL Server
# it must be an N-type: reading a varchar column through a nationalized mapping fails
# with "The conversion from varchar to NCHAR is unsupported."
- property:
    name: clobType
    value: "nvarchar(max)"
    dbms: mssql
- property:
    name: clobType
    value: longtext
    dbms: mysql,mariadb
# h2 -> CLOB, postgresql -> text
- property:
    name: clobType
    value: clob
# Same ordering rule as clobType above. MySQL's bare `timestamp` is whole-second, which
# silently defeats the updatedAt conflict check in GenericEntityService.updateEntity
# (starter#41) — two writers inside the same second read back an unchanged timestamp and
# both are accepted. Microseconds are what Hibernate binds, so ask for all six digits.
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: mysql,mariadb
- property:
    name: timestampType
    value: "timestamp(6)"
    dbms: postgresql
# h2 -> TIMESTAMP(6), mssql -> datetime2(7); both already at or beyond microseconds.
- property:
    name: timestampType
    value: timestamp
- changeSet:
    id: rama-spring-security-001-api-key
    author: rama-spring-starter
    # Every other starter changeset carries this. Without it, resolving ${clobType} to a
    # different value per database (starter#48) changes the stored checksum and Liquibase
    # refuses to run against an existing schema.
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - not:
        tableExists:
          tableName: api_key
    changes:
    - createTable:
        tableName: api_key
        columns:
        - column:
            name: id
            type: BIGINT
            autoIncrement: true
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: name
            type: VARCHAR(100)
        - column:
            name: key_hash
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: username
            type: VARCHAR(150)
            constraints:
              nullable: false
        - column:
            name: roles
            type: "${clobType}"
        - column:
            name: enabled
            type: BOOLEAN
            constraints:
              nullable: false
        - column:
            name: expires_at
            type: "${timestampType}"
        - column:
            name: last_used_at
            type: "${timestampType}"
        - column:
            name: created_by
            type: VARCHAR(100)
        - column:
            name: updated_by
            type: VARCHAR(100)
        - column:
            name: created_at
            type: "${timestampType}"
        - column:
            name: updated_at
            type: "${timestampType}"
    - addUniqueConstraint:
        tableName: api_key
        columnNames: key_hash
        constraintName: uk_api_key__key_hash
    - createIndex:
        tableName: api_key
        indexName: ix_api_key__username
        columns:
        - column:
            name: username
    - createIndex:
        tableName: api_key
        indexName: ix_api_key__enabled
        columns:
        - column:
            name: enabled
