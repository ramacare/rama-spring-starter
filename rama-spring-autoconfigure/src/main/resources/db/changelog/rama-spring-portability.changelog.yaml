---
# Widens MySQL/MariaDB timestamp columns created before starter#48.
#
# The per-`dbms` `<property>` overrides used to be declared *after* the unscoped default, so
# Liquibase discarded them and MySQL got bare `timestamp` -- whole-second. That defeats the
# `updatedAt` conflict check in `GenericEntityService.updateEntity` (starter#41): two writers inside
# the same second read back an unchanged timestamp, both pass the check, and one write is lost.
#
# Fresh databases need none of this -- `_dbms-types.yaml` gives `CREATE TABLE` `timestamp(6)`.
# These changesets widen schemas that already exist. `dbms: mysql,mariadb` makes them no-ops
# everywhere else.
#
# NO SQL SERVER HALF. `${clobType}` resolving to `varchar(max)` instead of `nvarchar(max)` breaks
# every read of an `@Nationalized` column, but it never reached a running SQL Server database:
# ramaservice includes its own correctly-ordered `_dbms-types.yaml` from `upgrade/api.yaml`, and
# `includeAll: upgrade/` is parsed *before* `rama-spring-starter-master.yaml` -- so its
# `nvarchar(max)` was registered first and won for the whole run, the starter's tables included.
# The same first-definition-wins rule that caused the defect is what shielded the only SQL Server
# consumer from it. his-service, whose copy is included too late to win, runs on MySQL.
#
# Written as raw SQL rather than `modifyDataType` because MySQL drops a column's nullability when
# the column is re-declared, and `modifyDataType` cannot restate it.
databaseChangeLog:
- changeSet:
    id: rama-spring-portability-101-mysql-timestamp-precision-api
    author: claude
    dbms: mysql,mariadb
    validCheckSum: ANY
    preConditions:
    - onFail: MARK_RAN
    - onError: MARK_RAN
    - tableExists:
        tableName: api
    changes:
    - sql:
        sql: ALTER TABLE api MODIFY COLUMN created_at TIMESTAMP(6) NULL DEFAULT NULL, MODIFY COLUMN updated_at TIMESTAMP(6) NULL DEFAULT NULL
