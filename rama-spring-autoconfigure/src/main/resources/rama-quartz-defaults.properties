# Rama starter Quartz defaults — consumers can override any of these.
#
# Contributed by RamaQuartzDefaultsEnvironmentPostProcessor as the LOWEST-precedence property
# source, not by @PropertySource: spring.quartz.job-store-type has to be in the environment
# before Boot parses QuartzAutoConfiguration's nested JdbcStoreTypeConfiguration, and a
# @PropertySource on an auto-configuration lands far too late for that. See starter#49.
#
# The jobStore.* entries below are withheld automatically when the consumer selects a non-JDBC
# job store — RAMJobStore has no setter for them and Quartz treats that as fatal.
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.lockHandler.class=org.quartz.impl.jdbcjobstore.UpdateLockRowSemaphore
