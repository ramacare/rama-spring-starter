databaseChangeLog:
  - changeSet:
      id: 20260416-001-book
      author: claude
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: book
      changes:
        - createTable:
            tableName: book
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: VARCHAR(200)
              - column:
                  name: isbn
                  type: VARCHAR(20)
              - column:
                  name: published_year
                  type: INT
              - column:
                  name: status_code
                  type: VARCHAR(50)
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: ${timestampType}
              - column:
                  name: updated_at
                  type: ${timestampType}
        - createIndex:
            tableName: book
            indexName: ix_book__status_code
            columns:
              - column:
                  name: status_code
  # isbn is nullable, and SQL Server treats NULLs as equal in a unique index: only ONE row may
  # have a NULL isbn, where H2/MySQL/PostgreSQL allow any number. Most of the demo's fixtures
  # create books without an isbn, so the plain unique index makes the second insert fail with
  # "Cannot insert duplicate key ... The duplicate key value is (<NULL>)". A filtered index
  # gives SQL Server the same semantics as the other three. See starter#50.
  - changeSet:
      id: 20260416-003-book-isbn-unique
      author: claude
      validCheckSum: ANY
      dbms: '!mssql'
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              tableName: book
              indexName: ux_book__isbn
      changes:
        - createIndex:
            tableName: book
            indexName: ux_book__isbn
            unique: true
            columns:
              - column:
                  name: isbn
  - changeSet:
      id: 20260416-004-book-isbn-unique-mssql
      author: claude
      validCheckSum: ANY
      dbms: mssql
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              tableName: book
              indexName: ux_book__isbn
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX ux_book__isbn ON book (isbn) WHERE isbn IS NOT NULL
