databaseChangeLog:
  # FIRST, ahead of everything — including the starter's own master. Liquibase parameters are
  # global to a run and the first definition valid for the running database wins, so this is what
  # makes ${clobType} / ${timestampType} resolve correctly for the starter's tables AND for ours.
  # Include it later and it is silently ineffective for whatever was already parsed. See starter#48.
  - include:
      file: db/changelog/_dbms-types.yaml
  - include:
      file: db/changelog/rama-spring-starter-master.yaml
  - include:
      file: db/changelog/rama-spring-quartz.changelog.xml
  - include:
      file: db/changelog/book.yaml
  - include:
      file: db/changelog/bookReview.yaml
  - include:
      file: db/changelog/seed-apiKey.yaml
