databaseChangeLog:
  # This demo's own override slot — empty, but included first so the ordering is the one consumers
  # should copy. See the file for why it deliberately uses the colliding name.
  - include:
      file: db/changelog/_dbms-types.yaml
  # Then the starter's types, still ahead of everything that uses ${clobType} / ${timestampType}.
  # Liquibase parameters are global to a run and the first definition valid for the running database
  # wins, so this has to precede the starter's master AND our own tables. Include it later and it is
  # silently ineffective for whatever was already parsed. See starter#48.
  - include:
      file: db/changelog/rama-spring-dbms-types.yaml
  - include:
      file: db/changelog/rama-spring-starter-master.yaml
  - include:
      file: db/changelog/rama-spring-quartz.changelog.xml
  - include:
      file: db/changelog/book.yaml
  - include:
      file: db/changelog/bookReview.yaml
  - include:
      file: db/changelog/seed-apiKey.yaml
