# Activate with: --spring.profiles.active=postgres
# docker run -d --name rama-pg -e POSTGRES_PASSWORD=R@ma2025 -e POSTGRES_DB=rama_demo -p 5432:5432 postgres:16-alpine
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rama_demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:R@ma2025}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Quartz stores JOB_DATA as BYTEA on PostgreSQL (BLOB would mean an OID large object). The
# matching org.quartz.jobStore.driverDelegateClass is contributed by the starter automatically.
spring.liquibase.parameters.blob_type=BYTEA
