spring.application.name=rama-spring-demo
spring.profiles.active=h2

# --- DataSource ---
# One profile per supported engine: h2 (default), postgres, mysql, mssql. The datasource lives
# entirely in application-<profile>.properties so switching engines is a single flag:
#   mvn -pl rama-spring-demo spring-boot:run -Dspring-boot.run.profiles=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/db.changelog-master.yaml

# --- GraphQL ---
spring.graphql.http.path=/graphql
spring.graphql.schema.locations=classpath*:graphql/**/
spring.graphql.graphiql.enabled=true

# --- Encryption (starter requires a key when @Convert(Encrypt.class) is on classpath) ---
encrypt.key=1234567812345678

# --- Starter feature flags ---
rama.mongo.enabled=false
rama.meilisearch.enabled=false
rama.ftp.enabled=false
rama.api-key.enabled=true
rama.quartz.allowed-job-packages=org.rama.demo.job

# --- Quartz ---
# Runs against the JDBC job store on every supported engine; the QRTZ_* tables come from the
# starter's rama-spring-quartz.changelog.xml, included by db.changelog-master.yaml. The starter
# contributes job-store-type=jdbc (and the PostgreSQL driver delegate) through
# RamaQuartzDefaultsEnvironmentPostProcessor, so nothing needs restating here. Set
# spring.quartz.job-store-type=memory to get an in-memory scheduler instead — the starter then
# withholds its JDBC-only jobStore.* defaults, which RAMJobStore would reject.

# --- Spring Cloud Vault: disabled (starter bundles it; demo does not use it) ---
spring.cloud.vault.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# --- Demo-specific toggles ---
demo.jobs.book-audit.enabled=false
demo.jobs.book-audit.cron=0 0/5 * * * ?

server.port=8080
