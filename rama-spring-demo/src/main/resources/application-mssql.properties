# Activate with: --spring.profiles.active=mssql
# docker run -d --name rama-mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=R@ma2025 -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:rama_demo};encrypt=false
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:R@ma2025}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
