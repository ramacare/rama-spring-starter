# Activate with: --spring.profiles.active=mysql
# docker run -d --name rama-mysql -e MYSQL_ROOT_PASSWORD=R@ma2025 -e MYSQL_DATABASE=rama_demo -p 3306:3306 mysql:8.4
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rama_demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:R@ma2025}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
